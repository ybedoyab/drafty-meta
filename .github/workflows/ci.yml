name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CalculiX
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libgl1 libglib2.0-0
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check packages apps tests
      - name: Test
        run: pytest -m "not fem"
      - name: Finite element benchmark
        run: pytest -m fem

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
