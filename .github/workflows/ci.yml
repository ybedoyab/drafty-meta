name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drafty
          POSTGRES_PASSWORD: drafty
          POSTGRES_DB: drafty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drafty -d drafty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CalculiX
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libgl1 libglu1-mesa libglib2.0-0
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check packages apps tests
      - name: SQL concurrency (migration 0007)
        env:
          DRAFTY_TEST_DATABASE_URL: postgresql://drafty:drafty@localhost:5432/drafty_test
        run: pytest -m postgres -q --tb=short
      - name: Test
        run: pytest -m "not fem and not postgres"
      - name: Finite element benchmark
        run: pytest -m fem

  api-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the lightweight API
        run: pip install -r requirements.api.txt && pip install --no-deps .
      - name: Import the Vercel entry without CAD
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('cadquery') is None; assert importlib.util.find_spec('gmsh') is None"
          python -c "from app import app; assert app.title"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CalculiX
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libgl1 libglu1-mesa libglib2.0-0
      - name: Install package
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start API without Meta
        run: |
          MODEL_API_KEY=' ' nohup python -m uvicorn drafty_api.main:app --host 127.0.0.1 --port 8000 > /tmp/drafty-api.log &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health && exit 0; sleep 1; done
          exit 1
      - name: Browser tests
        working-directory: apps/web
        env:
          DRAFTY_LIVE_META: "0"
        # Keep assertions unchanged. Run scenario UI tests before the real CalculiX
        # job so the FEM worker does not starve demo loads on the shared runner.
        run: |
          set +e
          npx playwright test e2e/scenario.spec.ts --reporter=line --workers=1
          scenario_status=$?
          npx playwright test e2e/batch-10b.spec.ts --reporter=line --workers=1
          batch10b_status=$?
          npx playwright test e2e/bracket-fem.spec.ts --reporter=line --workers=1
          fem_status=$?
          if [ -f /tmp/drafty-api.log ]; then
            echo "---- drafty API log (tail) ----"
            tail -n 200 /tmp/drafty-api.log || true
          fi
          if [ "$scenario_status" -ne 0 ] || [ "$batch10b_status" -ne 0 ] || [ "$fem_status" -ne 0 ]; then
            exit 1
          fi
