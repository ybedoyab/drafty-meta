services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CCX_BIN: ccx
      DRAFTY_USE_DOCKER_CCX: never
      DRAFTY_DATA_DIR: /data
    volumes:
      - drafty-data:/data

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  drafty-data:
